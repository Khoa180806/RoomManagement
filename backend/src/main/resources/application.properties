spring.application.name=room-management-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/room_management}
spring.datasource.username=${DATABASE_USERNAME:room_management}
spring.datasource.password=${DATABASE_PASSWORD:room_management}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.receipts.storage-path=${RECEIPT_STORAGE_PATH:./receipts}

app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.telegram.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}

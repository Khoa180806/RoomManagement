spring.application.name=room-management-api
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/room_management}
spring.datasource.username=${DATABASE_USERNAME:room_management}
spring.datasource.password=${DATABASE_PASSWORD:room_management}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
